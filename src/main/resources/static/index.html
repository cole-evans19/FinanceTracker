<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Server Pay Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Server Pay Tracker</h1>

    <section id="auth-section">
        <div id="login-form-container">
            <h2>Log In</h2>
            <form id="login-form">
                <label>
                    Username:
                    <input type="text" id="login-username" required>
                </label>
                <label>
                    Password:
                    <input type="password" id="login-password" required>
                </label>
                <button type="submit">Log In</button>
            </form>
            <p id="login-message"></p>
            <button id="show-register-btn">Need an account? Register</button>
        </div>

        <div id="register-form-container" style="display: none;">
            <h2>Register</h2>
            <form id="register-form">
                <label>
                    Username:
                    <input type="text" id="register-username" required>
                </label>
                <label>
                    Password:
                    <input type="password" id="register-password" required>
                </label>
                <button type="submit">Register</button>
            </form>
            <p id="register-message"></p>
            <button id="show-login-btn">Already have an account? Log in</button>
        </div>
    </section>

    <div id="app-content" style="display: none;">
        <p>Welcome, <span id="current-username"></span> - <button id="logout-btn">Log Out</button></p>
        <section id="job-section">
            <h2>Job</h2>
            <select id="job-select"></select>

            <form id="add-job-form">
                <input type="text" id="new-job-name" placeholder="New Job Name" required>
                <button type="submit">Add Job</button>
            </form>
        </section>
        <section id="add-shift-section">
            <h2>Add a Shift</h2>
            <form id="add-shift-form">
                <label>
                    Date:
                    <input type="date" id="shift-date" required>
                </label>
                <label>
                    Type:
                    <select id="shift-type" required>
                        <option value="MORNING">Morning</option>
                        <option value="EVENING">Evening</option>
                    </select>
                </label>
                <label>
                    Role:
                    <input type="text" id="shift-role" list="role-suggestions" required>
                    <datalist id="role-suggestions">
                        <option value="Server">
                        <option value="Bartender">
                        <option value="Busser">
                        <option value="Expo">
                        <option value="Host">
                        <option value="Manager">
                    </datalist>
                </label>
                <label>
                    Hours:
                    <input type="number" id="shift-hours" step="0.1" min="0" required>
                </label>
                <label>
                    Wage:
                    <input type="number" id="shift-wage" step="0.01" min="0" required>
                </label>
                <label>
                    Cash Tips:
                    <input type="number" id="shift-cash-tips" step="0.01" min="0" required>
                </label>
                <label>
                    Card Tips:
                    <input type="number" id="shift-card-tips" step="0.01" min="0" required>
                </label>
                <div id="custom-attributes-container">
                    <h3>Custom Fields (optional)</h3>
                    <div id="custom-attributes-list"></div>
                    <button type="button" id="add-custom-field-btn">+ Add Custom Field</button>
                </div>
                <button type="submit">Add Shift</button>
            </form>
            <p id="add-shift-message"></p>
        </section>

        <section id="date-range-section">
            <h2>Change Date Range</h2>

                <div id="quick-range-buttons">
                    <button type="button" class="quick-range-btn" data-months="1">1 Month</button>
                    <button type="button" class="quick-range-btn" data-months="3">3 Months</button>
                    <button type="button" class="quick-range-btn" data-months="6">6 Months</button>
                    <button type="button" class="quick-range-btn" data-months="12">1 Year</button>
                </div>

            <h3>Custom Range</h3>
                <label>
                    Start:
                    <input type="date" id="range-start">
                </label>
                <label>
                    End:
                    <input type="date" id="range-end">
                </label>
                <button id="load-data-btn">Load Data</button>
        </section>

        <section id="summary-section">
            <h2>Summary</h2>
            <div id="summary-output">No data loaded yet.</div>
        </section>

        <section id="profitability-section">
            <h2>Profitability</h2>
            <label>
                Minimum shifts to include:
                <input type="number" id="min-shifts-input" value="1" min="1">
            </label>
            <div id="profitability-output">No data loaded yet.</div>
        </section>

        <section id="attribute-profitability-section">
            <h2>Attribute Profitability</h2>
            <label>
                Minimum Shifts to include:
                <input type="number" id="attribute-min-shifts-input" value="1" min="1">
            </label>
            <div id="attribute-profitability-output"></div>
        </section>

        <section id="shifts-list-section">
            <h2>Complete Shift Index</h2>
            <table id="shifts-table">
                <thead>
                    <tr id="shifts-table-header-row">
                        <th>Date</th>
                        <th>Type</th>
                        <th>Role</th>
                        <th>Hours</th>
                        <th>Wage</th>
                        <th>Cash Tips</th>
                        <th>Card Tips</th>
                        <th>Gross Pay</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="shifts-table-body">
                </tbody>
            </table>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
